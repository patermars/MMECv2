<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMEC · Earnings Call Risk Predictor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e17;
      --surface: #111827;
      --surface2: #1a2235;
      --border: #1f2937;
      --accent: #6366f1;
      --accent-glow: rgba(99,102,241,0.25);
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
      --text: #e5e7eb;
      --text-dim: #9ca3af;
      --radius: 12px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    .header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(99,102,241,0.06) 0%, transparent 100%);
    }
    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #818cf8, #6366f1, #4f46e5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }
    .header .badge {
      font-size: 0.7rem;
      font-weight: 500;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      color: var(--text-dim);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 28px;
    }

    /* Sidebar */
    .sidebar { display: flex; flex-direction: column; gap: 20px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .card-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-dim);
      display: block;
      margin-bottom: 6px;
      margin-top: 0;
    }

    select, input[type="file"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 14px;
    }
    select:focus, input[type="file"]:focus, input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    select option { background: var(--surface); }

    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 10px;
    }
    .btn-secondary:hover {
      background: var(--surface);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .btn-tradingview {
      background: linear-gradient(135deg, #2962ff, #1e53e5);
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(41, 98, 255, 0.25);
    }
    .btn-tradingview:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(41, 98, 255, 0.35);
    }
    .btn-tradingview svg {
      width: 18px;
      height: 18px;
    }

    .tradingview-container {
      width: 100%;
      height: 500px;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface2);
    }
    .tradingview-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #tradingviewChart {
      display: none;
    }
    #tradingviewChart.visible {
      display: block;
    }

    .action-bar {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Results area */
    .results-area { display: flex; flex-direction: column; gap: 20px; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 400px;
      text-align: center;
      color: var(--text-dim);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.4; }
    .empty-state p { font-size: 0.9rem; max-width: 300px; line-height: 1.6; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .result-header .ticker-big {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #818cf8, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .result-header .meta-info {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    /* Prediction cards grid */
    .pred-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .pred-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      text-align: center;
      transition: border-color 0.2s, transform 0.2s;
    }
    .pred-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .pred-card .window-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .pred-card .value {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .pred-card .sub {
      font-size: 0.72rem;
      color: var(--text-dim);
    }
    .risk-low { color: var(--green); }
    .risk-med { color: var(--amber); }
    .risk-high { color: var(--red); }

    /* Model comparison table */
    .comp-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .comp-table th {
      text-align: left;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }
    .comp-table td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .comp-table tr:hover td { background: rgba(255,255,255,0.02); }
    .comp-table .model-name { font-weight: 600; }
    .comp-table .selected-row td { background: rgba(99,102,241,0.08); }

    /* Actual labels */
    .actual-row {
      display: flex;
      gap: 16px;
      margin-top: 10px;
    }
    .actual-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.78rem;
    }
    .actual-chip .label { color: var(--text-dim); font-size: 0.68rem; display: block; margin-bottom: 2px; }
    .actual-chip .val { font-weight: 600; }

    .spinner {
      border: 3px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
      .pred-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>MMEC · Earnings Call Risk Predictor</h1>
  <span class="badge">{{ model_types|length }} models</span>
</div>

<div class="container">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="card">
      <div class="card-title">Upload Audio</div>

      <label for="companyInput">Company Name</label>
      <input type="text" id="companyInput" placeholder="e.g., AAPL" style="width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:0.85rem;outline:none;margin-bottom:14px;">

      <label for="fileInput">Upload Audio File</label>
      <input type="file" id="fileInput" accept=".mp3,.wav,.m4a,.flac" style="margin-bottom:14px;">

      <label for="transcriptInput">Upload Transcript (Optional - for better accuracy)</label>
      <input type="file" id="transcriptInput" accept=".txt" style="font-size:0.75rem;margin-bottom:14px;">

      <label for="modelSelect">Model</label>
      <select id="modelSelect">
        {% for m in model_types %}
        <option value="{{ m }}" {% if m == 'early_fusion' %}selected{% endif %}>{{ m }}</option>
        {% endfor %}
      </select>

      <button class="btn btn-primary" onclick="uploadFile()">
        Run Prediction
      </button>
    </div>
  </div>

  <!-- Results -->
  <div class="results-area" id="resultsArea">
    <div class="card empty-state" id="emptyState">
      <div class="icon">📊</div>
      <p>Upload an audio file with company name to predict post-earnings volatility. Optionally include a transcript (.txt) for better text analysis.</p>
    </div>
  </div>
</div>

<script>
function showLoading() {
  document.getElementById('resultsArea').innerHTML = `
    <div class="card empty-state">
      <div class="spinner"></div>
      <p style="margin-top:16px">Running inference…</p>
    </div>`;
}

function riskClass(val) {
  if (val < 0.35) return 'risk-low';
  if (val < 0.65) return 'risk-med';
  return 'risk-high';
}

function riskLabel(val) {
  if (val < 0.35) return 'Low Risk';
  if (val < 0.65) return 'Moderate';
  return 'High Risk';
}

function renderResults(data) {
  const area = document.getElementById('resultsArea');
  const selected = data.selected_model;
  const preds = (data.predictions && data.predictions[selected]) || {};
  const meta = data.meta || {};

  let ticker = meta.ticker || meta.company || (data.call_id ? data.call_id.split('_')[0] : 'UNKNOWN');
  let date = meta.date || '';
  let nUtts = meta.n_utterances || meta.segments || meta.source || '';

  // Store ticker globally for TradingView button
  window.currentTicker = ticker;

  // Header with TradingView button
  let html = `<div class="card">
    <div class="result-header">
      <span class="ticker-big">${ticker}</span>
      <div class="meta-info">
        <div>${date}</div>
        <div style="font-size:0.75rem">${typeof nUtts === 'number' ? nUtts + ' utterances' : nUtts} · ${data.call_id || 'N/A'}</div>
      </div>
    </div>
    <div class="action-bar">
      <button onclick="toggleTradingView()" class="btn-tradingview">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 4h16v16H4V4zm2 2v12h12V6H6zm2 2h8v2H8V8zm0 4h8v2H8v-2z"/>
        </svg>
        <span id="tvButtonText">Show ${ticker} Chart</span>
      </button>
      <a href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(ticker)}" target="_blank" class="btn-tradingview" style="background: linear-gradient(135deg, #374151, #1f2937);">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
        </svg>
        Open in New Tab
      </a>
    </div>
  </div>`;

  // TradingView embedded chart (hidden by default)
  html += `<div class="card" id="tradingviewChart">
    <div class="card-title">Live Chart - ${ticker}</div>
    <div class="tradingview-container">
      <iframe src="https://www.tradingview.com/widgetembed/?frameElementId=tradingview_chart&symbol=${encodeURIComponent(ticker)}&interval=D&hidesidetoolbar=0&symboledit=1&saveimage=1&toolbarbg=f1f3f6&studies=[]&theme=dark&style=1&timezone=Etc%2FUTC&withdateranges=1&studies_overrides={}&overrides={}&enabled_features=[]&disabled_features=[]&locale=en&utm_source=localhost&utm_medium=widget_new&utm_campaign=chart&utm_term=${encodeURIComponent(ticker)}" frameborder="0" allowtransparency="true" scrolling="no" allowfullscreen=""></iframe>
    </div>
  </div>`;
  // Primary prediction cards
  html += `<div class="card"><div class="card-title">Predicted Volatility Rank (${selected})</div>
  <div class="pred-grid">`;
  const windows = ['1-day', '3-day', '7-day'];
  const windowLabels = ['1-Day', '3-Day', '7-Day'];
  windows.forEach((w, i) => {
    const v = preds[w];
    if (v !== undefined && v !== null) {
      html += `<div class="pred-card">
        <div class="window-label">${windowLabels[i]} Volatility</div>
        <div class="value ${riskClass(v)}">${(v * 100).toFixed(1)}%</div>
        <div class="sub">${riskLabel(v)}</div>
      </div>`;
    }
  });
  html += `</div>`;

  // Actual labels if available
  if (data.actuals && Object.keys(data.actuals).length > 0) {
    html += `<div style="margin-top:16px">
      <div class="card-title" style="margin-bottom:8px">Actual (Raw Abnormal Volatility)</div>
      <div class="actual-row">`;
    for (const [k, v] of Object.entries(data.actuals)) {
      if (v !== undefined && v !== null) {
        html += `<div class="actual-chip"><span class="label">${k}</span><span class="val">${v.toFixed(5)}</span></div>`;
      }
    }
    html += `</div></div>`;
  }
  html += `</div>`;

  // Model comparison table
  if (data.predictions && Object.keys(data.predictions).length > 0) {
    html += `<div class="card"><div class="card-title">Model Comparison</div>
    <table class="comp-table"><thead><tr>
      <th>Model</th>`;
    windows.forEach((w, i) => { html += `<th>${windowLabels[i]}</th>`; });
    html += `</tr></thead><tbody>`;
    for (const [mtype, mpreds] of Object.entries(data.predictions)) {
      if (!mpreds) continue;
      const isSelected = mtype === selected;
      html += `<tr class="${isSelected ? 'selected-row' : ''}">
        <td class="model-name">${mtype}${isSelected ? ' ★' : ''}</td>`;
      windows.forEach(w => {
        const v = mpreds[w];
        if (v !== undefined && v !== null) {
          html += `<td class="${riskClass(v)}">${(v * 100).toFixed(1)}%</td>`;
        } else {
          html += `<td style="color:var(--text-dim)">—</td>`;
        }
      });
      html += `</tr>`;
    }
    html += `</tbody></table></div>`;
  }

  area.innerHTML = html;
}

function toggleTradingView() {
  const chart = document.getElementById('tradingviewChart');
  const btnText = document.getElementById('tvButtonText');
  const ticker = window.currentTicker || 'UNKNOWN';
  
  if (chart.classList.contains('visible')) {
    chart.classList.remove('visible');
    btnText.textContent = `Show ${ticker} Chart`;
  } else {
    chart.classList.add('visible');
    btnText.textContent = `Hide ${ticker} Chart`;
    // Scroll to chart
    setTimeout(() => {
      chart.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 100);
  }
}

function pollJob(jobId, elapsed) {
  const area = document.getElementById('resultsArea');
  const mins = Math.floor(elapsed / 60), secs = elapsed % 60;
  area.innerHTML = `
    <div class="card empty-state">
      <div class="spinner"></div>
      <p style="margin-top:16px">Processing audio… ${mins}m ${secs}s<br>
      <span style="font-size:0.75rem;color:var(--text-dim)">Sampling ~30 segments · encoding with wav2vec2</span></p>
    </div>`;
  fetch(`/job/${jobId}`)
    .then(r => r.json())
    .then(data => {
      if (data.status === 'pending') {
        setTimeout(() => pollJob(jobId, elapsed + 3), 3000);
      } else if (data.status === 'error') {
        alert('Processing error: ' + data.error);
      } else {
        renderResults(data);
      }
    })
    .catch(err => alert('Poll error: ' + err));
}

function uploadFile() {
  const file = document.getElementById('fileInput').files[0];
  const transcript = document.getElementById('transcriptInput').files[0];
  const company = document.getElementById('companyInput').value.trim();
  if (!file) { alert('Please select an audio file'); return; }
  if (!company) { alert('Please enter company name'); return; }
  showLoading();
  const model = document.getElementById('modelSelect').value;
  const fd = new FormData();
  fd.append('file', file);
  fd.append('company_name', company);
  if (transcript) fd.append('transcript', transcript);
  fd.append('model_type', model);
  fetch('/upload', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(data => {
      if (data.error) { alert(data.error); return; }
      pollJob(data.job_id, 0);
    })
    .catch(err => alert('Error: ' + err));
}
</script>
</body>
</html>
