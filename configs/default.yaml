data:
  dataset_dir: "dataset/sp1500_earningscall"
  processed_dir: "data/processed"
  labels_path: "data/processed/labels.csv"
  max_utterances: 200
  min_utterances: 5

audio:
  sample_rate: 16000
  n_acoustic_features: 29

text:
  model_name: "ProsusAI/finbert"
  max_length: 512
  embedding_dim: 768

wav2vec:
  model_name: "facebook/wav2vec2-base"
  embedding_dim: 768

model:
  hidden_dim: 256
  n_heads: 4
  dropout: 0.2
  n_structured: 5

training:
  epochs: 50
  batch_size: 16
  num_workers: 0
  pin_memory: true
  lr: 2.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  patience: 15
  n_seeds: 5

splits:
  train: ["2017-04-24", "2017-10-31"]
  val: ["2017-11-01", "2017-12-31"]
  test: ["2018-01-01", "2018-06-21"]

label:
  estimation_window: 200
  event_windows: [1, 3, 7]
  primary_target: "abnormal_vol_3d"