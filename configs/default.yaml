paths:
  # ACL19 dataset root — override with --acl19-root on Colab
  acl19_root: ACL19_Release

  # Processed outputs
  transcripts: data/processed/transcripts   # parsed call JSON files
  labels:      data/processed/labels        # labels.csv
  splits:      data/splits                  # train/val/test CSVs

  # Optional: company -> ticker mapping
  ticker_map:  data/raw/ticker_map.json

audio:
  target_sr:       16000
  min_duration_s:  1.5     # sentences shorter than this are dropped

features:
  feature_set: egemaps   # 88-dim, suited for ~500-call dataset
  audio_dim:   88
  text_dim:    768        # FinBERT CLS
  ling_dim:    7          # Loughran-McDonald

text:
  finbert_model: ProsusAI/finbert
  max_length:    512

labels:
  estimation_window: 200
  event_windows:     [1, 3, 7]
  primary_target:    abnormal_vol_3d

splits:
  train: 0.70
  val:   0.15
  test:  0.15
  seed:  42

model:
  audio_dim:    88
  text_dim:     768
  hidden_dim:   128
  n_heads:      2
  n_structured: 5
  dropout:      0.4
  n_layers:     1

training:
  device:              cpu   # auto-detected: cuda if available, else cpu
  batch_size:          16
  lr:                  0.0005
  finbert_lr:          0.00002
  weight_decay:        0.05
  max_epochs:          100
  patience:            20
  gradient_clip:       1.0
  loss_mse_weight:     0.7
  loss_rank_weight:    0.3
  finbert_unfreeze_epoch: 5
  warmup_pct:          0.1
  seed:                42
  target_transform:    rank    # "rank" or "zscore"
  multi_window:        true    # use 1d+3d+7d windows to 3× dataset

augmentation:
  feature_noise_std:   0.05
  feature_dropout_p:   0.15
